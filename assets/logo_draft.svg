<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Gradient Definitions -->
  <defs>
    <linearGradient id="blueGradient" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop stop-color="#05A6F0"/>
      <stop offset="1" stop-color="#0D3EC2"/>
    </linearGradient>
    <linearGradient id="lightBlueGradient" x1="0" y1="0" x2="512" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#16D9FF"/>
      <stop offset="1" stop-color="#05A6F0"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="10"/>
      <feOffset dx="0" dy="10" result="offsetblur"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.3"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- The "MLS" Ribbon Monogram -->
  <g filter="url(#shadow)">
    <!-- Main Vertical Spine (Shared) -->
    <path d="M120 100 V412" stroke="url(#blueGradient)" stroke-width="60" stroke-linecap="square"/>
    
    <!-- THE "M" (Left-aligned to spine) -->
    <path d="M120 100 L180 250 L240 100" fill="none" stroke="url(#blueGradient)" stroke-width="60" stroke-linejoin="round"/>
    
    <!-- THE "L" (Bottom of spine) -->
    <path d="M120 412 H312" fill="none" stroke="url(#blueGradient)" stroke-width="60" stroke-linecap="square"/>

    <!-- THE "S" (Ribbon wrapping around the spine) -->
    <!-- Top Curve of S -->
    <path d="M220 180 C320 180 380 240 380 280 C380 320 320 360 220 360" fill="none" stroke="url(#lightBlueGradient)" stroke-width="60" stroke-linecap="round"/>
    
    <!-- Ribbon Fold Overlap Effect -->
    <path d="M220 180 L280 200" fill="none" stroke="rgba(0,0,0,0.1)" stroke-width="60" stroke-linecap="round"/>
  </g>
</svg>
